    <g stroke="url(#ret)" stroke-width="18" stroke-linecap="round">
      <line x1="0" y1="-186" x2="0" y2="-120"/><line x1="0" y1="120" x2="0" y2="186"/>
      <line x1="-186" y1="0" x2="-120" y2="0"/><line x1="120" y1="0" x2="186" y2="0"/>
    </g>
