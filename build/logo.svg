<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b26"/><stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="ret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6f"/><stop offset="1" stop-color="#8B0000"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ED4245" stop-opacity=".45"/><stop offset="1" stop-color="#ED4245" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
